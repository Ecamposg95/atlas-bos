# A generic, single database configuration for Atlas BOS.
#
# env.py reads the actual SQLAlchemy URL from app.core.database (which loads
# DATABASE_URL from the environment / .env). Leave sqlalchemy.url empty here.

[alembic]
# Path to migration scripts. Use forward slashes (/) on all platforms.
script_location = alembic

# Template used to generate migration file names. ISO-ish timestamp + slug
# keeps versions chronologically sortable on disk.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Allow .py files inside versions/ that don't match the rev pattern (e.g.
# helpers). Off by default; uncomment if needed.
# sourceless = false

# Timezone for file_template timestamps. Empty = local time.
# timezone =

# Max length of slug field in file_template
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command, regardless
# of autogenerate.
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a source .py file to be
# detected as revisions in the versions/ directory.
# sourceless = false

# Version path separator; default is os.pathsep.
version_path_separator = os

# The output encoding used when revision files are written from script.py.mako.
# output_encoding = utf-8

# Pulled from app.core.database at runtime; do NOT hardcode.
sqlalchemy.url =


# [post_write_hooks]
# This section defines scripts or Python functions that are run after a
# revision file is written. Examples (commented):
#
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME


# Logging configuration ------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
