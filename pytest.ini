[pytest]
testpaths = tests
# Repo root en sys.path para que `import app` funcione con `pytest` (bare, como
# lo invoca el CI), no solo con `python -m pytest`. Arregla el
# ModuleNotFoundError: No module named 'app' al cargar conftest.
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# test_cash_complete.py es un script de integración (hace sys.exit(1) al importar
# sin un servidor vivo) → rompía la colección entera. Se excluye por defecto.
addopts = -v --tb=short --ignore=tests/test_cash_complete.py
