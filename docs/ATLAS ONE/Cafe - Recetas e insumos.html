<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Atlas One Café · Recetas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #FBF6EE; overflow: hidden; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    *, *::before, *::after { box-sizing: border-box; }
    #stage-wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #stage { width: 1440px; height: 900px; transform-origin: center center; flex-shrink: 0; box-shadow: 0 30px 80px rgba(0,0,0,0.25); border-radius: 12px; overflow: hidden; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="stage-wrap"><div id="stage"></div></div>
  <script type="text/babel" src="system.jsx"></script>
  <script type="text/babel" src="cafe.jsx"></script>
  <script type="text/babel">
    const W = 1440, H = 900;
    function fit() {
      const stage = document.getElementById('stage');
      const pad = 48;
      const sc = Math.min((window.innerWidth - pad) / W, (window.innerHeight - pad) / H, 1);
      stage.style.transform = 'scale(' + sc + ')';
    }
    ReactDOM.createRoot(document.getElementById('stage')).render(React.createElement(CafeRecipes));
    window.addEventListener('resize', fit);
    fit();
  </script>
</body>
</html>
